<a class="skip-link" href="#main">Skip to content</a>

<header class="site-header" [class.is-scrolled]="scrolled()">
  <div class="shell header-inner">
    <a routerLink="/" class="logo" (click)="closeMenu()">
      <img src="zeLogo2.png" alt="zetalents" class="logo-img" />
    </a>

    <nav class="nav-links" [class.is-open]="menuOpen()">
      @for (link of navLinks; track link.label) {
        <a [routerLink]="['/']" [fragment]="link.fragment" (click)="closeMenu()">{{ link.label }}</a>
      }
      <a class="btn btn-primary nav-cta" routerLink="/contact" (click)="closeMenu()">Request a Demo</a>
    </nav>

    <button
      class="menu-toggle"
      type="button"
      [class.is-open]="menuOpen()"
      (click)="toggleMenu()"
      aria-label="Toggle navigation menu"
    >
      <span></span><span></span><span></span>
    </button>
  </div>
</header>

<main id="main">
  <router-outlet />
</main>

<footer class="site-footer">
  <div class="shell footer-inner">
    <a routerLink="/" class="logo logo-footer">
      <img src="zeLogo2.png" alt="zetalents" class="logo-img" />
    </a>
    <nav class="footer-links">
      @for (link of navLinks; track link.label) {
        <a [routerLink]="['/']" [fragment]="link.fragment">{{ link.label }}</a>
      }
      <a routerLink="/contact">Contact</a>
      <a routerLink="/privacy-policy">Privacy Policy</a>
    </nav>
    <p class="footer-copy">&copy; 2016–2026 zetalents. All rights reserved.</p>
  </div>
</footer>
