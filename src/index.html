<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>zetalents — Regional HCIS Platform</title>
  <meta name="description" content="zetalents is a regional Human Capital Information System delivering complete HR management across KSA, Egypt, and the MENA region.">
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&family=Cairo:wght@400;500;600;700;800&family=Marcellus&display=swap" rel="stylesheet">
  <style>
    #app-loader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(ellipse 900px 600px at 50% 40%, #ffffff 0%, #fff8f3 55%, #fff3eb 100%);
      transition: opacity 0.5s ease, filter 0.5s ease, visibility 0.5s ease;
    }

    #app-loader.app-loader-hidden {
      opacity: 0;
      filter: blur(6px);
      visibility: hidden;
      pointer-events: none;
    }

    .app-loader-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 26px;
      animation: app-loader-in 0.7s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .app-loader-logo-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      animation: app-loader-breathe 2.4s ease-in-out infinite 0.7s;
    }

    .app-loader-logo {
      height: 90px;
      width: auto;
    }

    .app-loader-rule {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #a8450a;
    }

    .app-loader-rule::before,
    .app-loader-rule::after {
      content: '';
      width: 18px;
      height: 1px;
      background: currentColor;
      opacity: 0.4;
    }

    .app-loader-dots span {
      display: inline-block;
      animation: app-loader-dot 1.4s ease-in-out infinite;
    }
    .app-loader-dots span:nth-child(2) {
      animation-delay: 0.18s;
    }
    .app-loader-dots span:nth-child(3) {
      animation-delay: 0.36s;
    }

    .app-loader-track {
      position: relative;
      width: 160px;
      height: 3px;
      border-radius: 100px;
      background: #ffe0cb;
      overflow: hidden;
    }

    .app-loader-track::after {
      content: '';
      position: absolute;
      inset: 0;
      width: 42%;
      border-radius: 100px;
      background: linear-gradient(90deg, transparent, #f27020 45%, #d95f12 60%, transparent);
      animation: app-loader-sweep 1.3s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    @keyframes app-loader-in {
      from {
        opacity: 0;
        transform: translateY(10px) scale(0.97);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes app-loader-breathe {
      0%,
      100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.035);
      }
    }

    @keyframes app-loader-dot {
      0%,
      60%,
      100% {
        opacity: 0.3;
        transform: translateY(0);
      }
      30% {
        opacity: 1;
        transform: translateY(-2px);
      }
    }

    @keyframes app-loader-sweep {
      from {
        transform: translateX(-100%);
      }
      to {
        transform: translateX(330%);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .app-loader-inner,
      .app-loader-logo-wrap,
      .app-loader-dots span,
      .app-loader-track::after {
        animation: none;
      }
    }
  </style>
  
</head>
<body>
  <div id="app-loader">
    <div class="app-loader-inner">
      <div class="app-loader-logo-wrap">
        <img src="zeLogo2.png" alt="zetalents" class="app-loader-logo" />
      </div>
      <div class="app-loader-track"></div>
      <div class="app-loader-rule">
        <span>Loading</span>
        <span class="app-loader-dots"><span>.</span><span>.</span><span>.</span></span>
      </div>
    </div>
  </div>
  <app-root></app-root>
  <script>
    (function () {
      var MIN_VISIBLE_MS = 600;
      var start = Date.now();

      function hideLoader() {
        var loader = document.getElementById('app-loader');
        if (!loader) return;
        var wait = Math.max(0, MIN_VISIBLE_MS - (Date.now() - start));
        setTimeout(function () {
          loader.classList.add('app-loader-hidden');
          loader.addEventListener(
            'transitionend',
            function () {
              loader.remove();
            },
            { once: true },
          );
        }, wait);
      }

      if (document.readyState === 'complete') {
        hideLoader();
      } else {
        window.addEventListener('load', hideLoader);
      }
    })();
  </script>
</body>
</html>
